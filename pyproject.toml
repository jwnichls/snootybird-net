[project]
name = "snootybird"
version = "0.1.0"
description = "The Snooty Bird Publishing website"
authors = [{ name = "Jeff Nichols", email = "jeff@jeffreynichols.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
